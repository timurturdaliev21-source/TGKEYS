<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TGKEYS — Открытие кейсов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --gold: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      user-select: none;
    }
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 20px;
    }
    .title { font-weight: 800; font-size: 18px; letter-spacing: 0.5px; }
    .balance {
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold);
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
    }
    .roulette-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 130px;
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #334155;
      margin-bottom: 20px;
    }
    .pointer {
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 3px;
      background: var(--gold);
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 10px var(--gold);
    }
    .track {
      display: flex;
      align-items: center;
      height: 100%;
      will-change: transform;
    }
    .item {
      flex: 0 0 100px;
      height: 104px;
      margin: 0 5px;
      background: #0f172a;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 4px solid #64748b;
      padding: 6px;
      text-align: center;
    }
    .item .emoji { font-size: 36px; margin-bottom: 4px; }
    .item .name { font-size: 11px; font-weight: 600; color: var(--text); line-height: 1.1; }
    .item .price { font-size: 10px; color: var(--gold); margin-top: 2px; }

    .common { border-color: #64748b; }
    .rare { border-color: #3b82f6; }
    .epic { border-color: #a855f7; }
    .legendary { border-color: #f59e0b; background: rgba(245, 158, 11, 0.08); }

    .btn {
      width: 100%;
      max-width: 420px;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      margin-bottom: 24px;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .inv-title {
      width: 100%;
      max-width: 420px;
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .inventory {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .inv-card {
      background: var(--card);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      border-bottom: 3px solid #64748b;
    }
    .inv-card .emoji { font-size: 30px; }
    .inv-card .name { font-size: 12px; font-weight: 600; margin: 4px 0; }
    .sell-btn {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: none;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      width: 100%;
    }

    /* Модальное окно выигрыша */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: var(--card);
      border-radius: 22px;
      padding: 24px;
      text-align: center;
      width: 100%;
      max-width: 320px;
      border: 2px solid var(--gold);
    }
    .modal-box .big-emoji { font-size: 64px; margin: 12px 0; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions button {
      flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px;
    }
    .keep-btn { background: var(--accent); color: #fff; }
    .quick-sell-btn { background: #334155; color: var(--gold); }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">🎁 TGKEYS</div>
    <div class="balance">⭐ <span id="balance">500</span></div>
  </div>

  <div class="roulette-wrapper">
    <div class="pointer"></div>
    <div class="track" id="track"></div>
  </div>

  <button class="btn" id="spinBtn" onclick="openCase()">Открыть кейс — 100 ⭐</button>

  <div class="inv-title">
    <span>Твои игрушки</span>
    <span id="invCount">0 шт.</span>
  </div>
  <div class="inventory" id="inventory"></div>

  <div class="modal" id="winModal">
    <div class="modal-box">
      <div style="color: var(--muted); font-size: 13px;">Тебе выпало:</div>
      <div class="big-emoji" id="winEmoji">🧸</div>
      <div style="font-size: 20px; font-weight: 800;" id="winName">Плюшевый мишка</div>
      <div style="color: var(--gold); font-size: 14px; margin-top: 4px;" id="winPrice">50 ⭐</div>
      <div class="modal-actions">
        <button class="keep-btn" onclick="keepItem()">В инвентарь</button>
        <button class="quick-sell-btn" id="modalSellBtn" onclick="sellCurrent()">Продать</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const CASE_PRICE = 100;
    let balance = Number(localStorage.getItem('tgkeys_bal')) || 500;
    let inventory = JSON.parse(localStorage.getItem('tgkeys_inv') || '[]');
    let lastWonItem = null;
    let isSpinning = false;

    const ITEMS = [
      { name: 'Мишка Тедди', emoji: '🧸', price: 40, rarity: 'common', weight: 40 },
      { name: 'Сладкий торт', emoji: '🎂', price: 70, rarity: 'common', weight: 30 },
      { name: 'Волшебный шар', emoji: '🔮', price: 130, rarity: 'rare', weight: 16 },
      { name: 'Кепка Дурова', emoji: '🧢', price: 250, rarity: 'epic', weight: 9 },
      { name: 'Лягушонок Пепе', emoji: '🐸', price: 600, rarity: 'legendary', weight: 4 },
      { name: 'Золотая звезда', emoji: '🌟', price: 1500, rarity: 'legendary', weight: 1 }
    ];

    function pickRandomItem() {
      const totalWeight = ITEMS.reduce((s, i) => s + i.weight, 0);
      let r = Math.random() * totalWeight;
      for (const item of ITEMS) {
        if (r < item.weight) return item;
        r -= item.weight;
      }
      return ITEMS[0];
    }

    function createCardHTML(item) {
      return `
        <div class="item ${item.rarity}">
          <div class="emoji">${item.emoji}</div>
          <div class="name">${item.name}</div>
          <div class="price">${item.price} ⭐</div>
        </div>
      `;
    }

    function initTrack() {
      const track = document.getElementById('track');
      let html = '';
      for (let i = 0; i < 45; i++) {
        html += createCardHTML(pickRandomItem());
      }
      track.innerHTML = html;
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';
    }

    function openCase() {
      if (isSpinning) return;
      if (balance < CASE_PRICE) {
        balance += 200; // Бонус, если закончились звёзды
        saveState();
        alert('Баланс пополнен на 200 ⭐ бонусом!');
        return;
      }

      isSpinning = true;
      balance -= CASE_PRICE;
      saveState();
      document.getElementById('spinBtn').disabled = true;

      const track = document.getElementById('track');
      const winIndex = 36;
      lastWonItem = pickRandomItem();

      let html = '';
      for (let i = 0; i < 45; i++) {
        const item = (i === winIndex) ? lastWonItem : pickRandomItem();
        html += createCardHTML(item);
      }
      track.innerHTML = html;
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      const wrapperWidth = document.querySelector('.roulette-wrapper').offsetWidth;
      const cardFullWidth = 110; // 100px + 5px*2 margin
      const randomOffset = Math.floor(Math.random() * 50) - 25;
      const targetX = (winIndex * cardFullWidth) + (cardFullWidth / 2) - (wrapperWidth / 2) + randomOffset;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          track.style.transition = 'transform 4s cubic-bezier(0.12, 0.85, 0.22, 1)';
          track.style.transform = `translateX(-${targetX}px)`;
        });
      });

      setTimeout(() => {
        isSpinning = false;
        document.getElementById('spinBtn').disabled = false;
        showWinModal(lastWonItem);
      }, 4150);
    }

    function showWinModal(item) {
      document.getElementById('winEmoji').textContent = item.emoji;
      document.getElementById('winName').textContent = item.name;
      document.getElementById('winPrice').textContent = `${item.price} ⭐`;
      document.getElementById('modalSellBtn').textContent = `Продать (${item.price} ⭐)`;
      document.getElementById('winModal').classList.add('show');
    }

    function keepItem() {
      if (lastWonItem) {
        inventory.unshift({ ...lastWonItem, id: Date.now() });
        lastWonItem = null;
        saveState();
      }
      document.getElementById('winModal').classList.remove('show');
    }

    function sellCurrent() {
      if (lastWonItem) {
        balance += lastWonItem.price;
        lastWonItem = null;
        saveState();
      }
      document.getElementById('winModal').classList.remove('show');
    }

    function sellFromInv(id) {
      const idx = inventory.findIndex(i => i.id === id);
      if (idx !== -1) {
        balance += inventory[idx].price;
        inventory.splice(idx, 1);
        saveState();
      }
    }

    function saveState() {
      localStorage.setItem('tgkeys_bal', balance);
      localStorage.setItem('tgkeys_inv', JSON.stringify(inventory));
      renderUI();
    }

    function renderUI() {
      document.getElementById('balance').textContent = balance;
      document.getElementById('invCount').textContent = `${inventory.length} шт.`;
      const invEl = document.getElementById('inventory');
      invEl.innerHTML = inventory.map(item => `
        <div class="inv-card ${item.rarity}">
          <div class="emoji">${item.emoji}</div>
          <div class="name">${item.name}</div>
          <button class="sell-btn" onclick="sellFromInv(${item.id})">Продать ${item.price} ⭐</button>
        </div>
      `).join('');
    }

    initTrack();
    renderUI();
  </script>
</body>
</html>
